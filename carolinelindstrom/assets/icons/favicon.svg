  <path class="word" transform="translate(-19.5 5.5) scale(.285)" fill="none" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" d="M166 94 C 158 78, 134 74, 120 88 C 104 104, 104 140, 126 152 C 146 162, 168 152, 186 138 C 210 118, 240 86, 244 56 C 247 30, 220 26, 216 54 C 212 86, 214 124, 222 146 C 228 160, 246 160, 260 150"/>
